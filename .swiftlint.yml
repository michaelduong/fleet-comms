included:
  - Sources
  - Tests
excluded:
  - build
  - DerivedData
opt_in_rules:
  - closure_spacing
  - empty_count
  - explicit_init
  - first_where
  - sorted_imports
line_length:
  warning: 120
  error: 160
file_length:
  warning: 300
  error: 400
type_body_length:
  warning: 200
  error: 300
function_body_length:
  warning: 40
  error: 60
cyclomatic_complexity:
  warning: 10
  error: 15
identifier_name:
  excluded:
    - id
    - ms
